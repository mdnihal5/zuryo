services:
    - type: web
      name: zuryo-api
      runtime: node
      plan: free
      rootDir: api
      buildCommand: npm ci && npm run build
      startCommand: npm run migrate && npm start
      healthCheckPath: /healthz
      envVars:
          - key: NODE_VERSION
            value: "24"
          - key: NODE_ENV
            value: production
          - key: DATABASE_URL
            sync: false
          - key: DATABASE_SSL
            value: "true"
          - key: JWT_SECRET
            generateValue: true
          - key: CORS_ORIGINS
            sync: false
          - key: TRUST_PROXY
            value: "1"

    - type: web
      name: zuryo-web
      runtime: static
      rootDir: client
      buildCommand: npm ci && npm run build
      staticPublishPath: dist
      routes:
          - type: rewrite
            source: /*
            destination: /index.html
      envVars:
          - key: NODE_VERSION
            value: "24"
          - key: VITE_API_URL
            sync: false
